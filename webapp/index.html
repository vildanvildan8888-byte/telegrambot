<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5f0">
    <title>Вкусный двор</title>
    <link rel="stylesheet" href="/app/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script type="module" src="/app/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">ДОСТАВКА · ТАШКЕНТ</p>
        <h1>Вкусный двор</h1>
        <p id="greeting" class="greeting">Готовим для вас</p>
      </header>

      <section aria-labelledby="catalog-title" class="catalog-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">СВЕЖЕЕ МЕНЮ</p>
            <h2 id="catalog-title">Выберите блюдо</h2>
          </div>
        </div>
        <nav id="categories" class="category-list" aria-label="Категории меню"></nav>
        <p id="status" class="status" role="status" aria-live="polite">Загружаем меню…</p>
        <div id="products" class="product-list"></div>
      </section>

      <footer class="app-footer">
        <button class="cart-placeholder" type="button" disabled aria-disabled="true">
          <span>🛒 Корзина</span>
          <span>Скоро</span>
        </button>
        <p>Заказать можно в приложении. Корзина скоро появится здесь.</p>
      </footer>
    </main>
  </body>
</html>
